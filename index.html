<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Forge of the Elements</title>
<!-- 1.7's home-screen install (index.html:14-24, CH-37): the app manifest, its icons and colour, the 'Forge' title, and
     the standalone status bar. iOS installs from Safari's Share > Add to Home Screen and reads the apple- tags rather
     than the manifest on older versions; it will not use a transparent icon, hence the opaque apple-touch-icon. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/images/icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/images/icons/apple-touch-icon-152.png">
<meta name="theme-color" content="#080b11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/images/icons/icon-192.png">
<!-- The build stamp (O1): 'dev' here; tools/assets/stamp-build.mjs writes a release's time into its copy, and only a
     stamped build registers sw.js and stores the offline copy (src/platform/offline.js). -->
<meta name="forge-build" content="2026-10-27T11:03:28.000Z">
<!-- The bundle's size in bytes, for the loading veil's percentage: stamp-build.mjs writes it into a release copy. -->
<meta name="forge-bundle-bytes" content="3138994">
<style>
  html, body { margin: 0; height: 100%; background: #080b11; overflow: hidden; touch-action: none; }
  #game, #game canvas { position: fixed; inset: 0; display: block; }
  #text-entry { position: fixed; left: -9999px; top: 0; opacity: 0; }
  /* 1.7's loading screen (runtime/boot.js preloadArt, css/interface.css #loadVeil), here in the page so it paints before
     the bundle arrives (sandbox item 44, Justin 2026-10-16: "in 1.7 there is a loading screen"). It comes down once the
     title is drawn (main.js removes the veil then). */
  @font-face { font-family: 'Grenze Gotisch'; font-weight: 700; font-display: swap; src: url(assets/fonts/grenze-gotisch-700.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-display: swap; src: url(assets/fonts/ibm-plex-mono-400.woff2) format('woff2'); }
  #loadVeil { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #080b11; color: #bdc2d8; font: 14px 'IBM Plex Mono', monospace; text-align: center; padding: 0 16px; }
  #loadVeil h1 { font: 700 32px/1.1 'Grenze Gotisch', serif; color: #e8b44a; margin: 0; }
  #loadVeil button { background: none; border: 0; border-radius: 0; box-shadow: none; color: #e8b44a; font: 400 16px 'IBM Plex Mono', monospace; cursor: pointer;
    text-decoration: underline 1px; text-underline-offset: .3em; }
  #loadVeil button:focus-visible { outline: 1px solid #e8b44a; outline-offset: 3px; }
  /* 1.7 interface.css: a touch screen reads 2 px larger (--ui-mobile-text-add) */
  @media (pointer: coarse) { #loadVeil { font-size: 16px; } #loadVeil h1 { font-size: 34px; } #loadVeil button { font-size: 18px; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="loadVeil" data-fote-startup><h1>Forge of the Elements</h1><p role="status">Loading game… 0%</p><button hidden>Retry loading</button></div>
<script>
  // The veil leaves when the title is up; a boot that fails first says so, with 1.7's retry (a fresh load here).
  (function () {
    var veil = document.getElementById('loadVeil'), status = veil.querySelector('p'), retry = veil.querySelector('button');
    retry.onclick = function () { location.reload(); };
    // RB5 (1.7 bootstrap.js:77-80): the game's code still on its way after 10 s says so; main.js takes the words over.
    setTimeout(function () { if (veil.isConnected && retry.hidden && status.textContent === 'Loading game… 0%') status.textContent = 'Loading game… (slow connection, still loading)'; }, 10000);
    function failed(e) {
      if (!veil.isConnected) return;
      var why = e && (e.reason || e.error || e.message) || 'unknown error';
      status.textContent = 'Could not prepare this scene: ' + String(why.message || why) + ' Retry loading.';
      retry.hidden = false;
    }
    addEventListener('error', function (e) { var el = e.target; if (el && el.tagName === 'SCRIPT') failed({ message: 'the game script could not be loaded.' }); else if (!el || !el.tagName) failed(e); }, true);
    addEventListener('unhandledrejection', failed);
    // 1.7 bootstrap.js:66-74 (RB6): stalled means 60 s with no file at all arriving before the title is up. A slow
    // file is only reported, never asked for again; Reload restarts cleanly. The next file to arrive takes it away.
    var lastArrival = Date.now(), stalled = false, said = status.textContent;
    function arrived() { lastArrival = Date.now(); if (stalled) { stalled = false; status.textContent = said; retry.hidden = true; retry.textContent = 'Retry loading'; } }
    try { new PerformanceObserver(arrived).observe({ type: 'resource' }); } catch (e) { /* no observer: the timer alone */ }
    addEventListener('forge-load-progress', arrived);   // the game code arriving piece by piece (the loader below)
    var watch = setInterval(function () {
      if (!veil.isConnected) { clearInterval(watch); return; }
      if (!stalled && retry.hidden && Date.now() - lastArrival >= 60000) {
        stalled = true; said = status.textContent;
        status.textContent = 'Loading has stalled. Keep waiting, or reload to try again.';
        retry.textContent = 'Reload'; retry.hidden = false;
      }
    }, 1000);
  })();
</script>
<input id="text-entry" type="text" autocomplete="off" aria-hidden="true">
<script>
  // The game's code, counted as it arrives (Justin 2026-10-18: "the loading screen just says 0% and gives no indication
  // of progress"; 1.7 bootstrap.js:22, :77-95 counted its module downloads). The bundle is fetched here, its bytes shown
  // as 0-85% of "Loading game…" (main.js steps the rest: fonts, renderer, art list), then run from that one copy, so it
  // is never downloaded twice. The total comes from the release stamp (meta forge-bundle-bytes), else the dev server's
  // X-Decoded-Length, else an unpacked Content-Length; with none it counts megabytes. A failed download is asked again
  // twice; the code itself never runs twice. A browser without streams loads it the plain way.
  (function () {
    var SRC = 'build/main.js', SHARE = 85, status = document.querySelector('#loadVeil p');
    function say(w) { if (status && status.isConnected) status.textContent = w; }
    function fail(m) { dispatchEvent(new ErrorEvent('error', { message: m })); }
    function plain() { var s = document.createElement('script'); s.type = 'module'; s.src = SRC; document.body.appendChild(s); }
    if (!window.fetch || !window.ReadableStream || !window.Blob || !URL.createObjectURL) return plain();
    var stamp = Number((document.querySelector('meta[name="forge-bundle-bytes"]') || {}).content) || 0;
    function download(tries) {
      return fetch(SRC, { cache: 'no-cache' }).then(function (r) {
        if (!r.ok) throw new Error('the game script could not be loaded (HTTP ' + r.status + ').');
        var total = stamp || Number(r.headers.get('X-Decoded-Length')) || (!r.headers.get('content-encoding') && Number(r.headers.get('content-length'))) || 0;
        var reader = r.body.getReader(), parts = [], got = 0;
        return (function more() {
          return reader.read().then(function (c) {
            if (c.done) return parts;
            parts.push(c.value); got += c.value.length;
            dispatchEvent(new Event('forge-load-progress'));
            say(total ? 'Loading game… ' + Math.min(SHARE, Math.floor(got / total * SHARE)) + '%' : 'Loading game… ' + (got / 1048576).toFixed(1) + ' MB');
            return more();
          });
        })();
      }).catch(function (e) {
        if (tries >= 3) throw e;
        return new Promise(function (wait) { setTimeout(wait, 800 * tries); }).then(function () { return download(tries + 1); });
      });
    }
    download(1).then(function (parts) {
      say('Loading game… ' + SHARE + '%');
      // The source map named by its full address: the copy runs from a blob, not from build/.
      return import(URL.createObjectURL(new Blob(parts, { type: 'text/javascript' }))).catch(function (e) { fail('the game script could not start: ' + (e && e.message || e)); });
    }, function (e) { fail(e && e.message || 'the game script could not be loaded.'); });
  })();
</script>
</body>
</html>
