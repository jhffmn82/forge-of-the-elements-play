<h1>Sound review</h1>
<p>Every sound the game ships, with what it is for. Play it, then mark it <b>Keep</b> or <b>Redo</b> and say what is wrong with it. Verdicts are saved in this browser. When you are done, <b>Copy redo list</b> and paste it to Claude.</p>
<header><div class="bar">
<label>Show <select id="filter"><option value="all">All</option><option value="redo">Redo only</option><option value="unmarked">Unmarked only</option></select></label>
<label>Volume <input id="vol" type="range" min="0" max="1" step=".05" value=".6"></label>
<label><input id="loop" type="checkbox" checked> loop music</label>
<button id="stop">Stop</button><button id="copy">Copy redo list</button><button id="save">Save to dev server</button>
<span class="count" id="count"></span></div><div id="status">Pick a sound.</div></header>

   list.append(row)}}
 count()}
document.getElementById('filter').onchange=draw;document.getElementById('stop').onclick=()=>{stop();status.textContent='Stopped.'};vol.oninput=()=>{if(audio)audio.volume=+vol.value};
function redoText(){const lines=[];for(const c of CLIPS){const v=verdict(c.name);if(v.verdict==='redo'||v.pick)lines.push(c.name+(v.verdict==='redo'?' — REDO':'')+(v.note?': '+v.note:'')+(v.pick?' — use '+v.pick:''))}return lines.length?lines.join('\n'):'(nothing marked)'}
document.getElementById('copy').onclick=async()=>{const t=redoText();try{await navigator.clipboard.writeText(t);status.textContent='Copied '+t.split('\n').length+' line(s).'}catch(e){prompt('Copy this:',t)}};
document.getElementById('save').onclick=async()=>{try{const body='data:application/json;base64,'+btoa(unescape(encodeURIComponent(JSON.stringify(V,null,1))));const r=await fetch('/__shot/audio-verdicts.json',{method:'POST',body});status.textContent=r.ok?'Saved to art/_shots/audio-verdicts.json.':'The dev server did not take it; use Copy instead.'}catch(e){status.textContent='Not on the dev server; use Copy redo list instead.'}};
draw();
