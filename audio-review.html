<h1>Sound review</h1>
<p>Every sound the game ships, with what it is for. Play it, then mark it <b>Keep</b> or <b>Redo</b> and say what is wrong with it. Verdicts are saved in this browser. When you are done, <b>Copy redo list</b> and paste it to Claude.</p>
<header><div class="bar">
<label>Show <select id="filter"><option value="needs">Needs review</option><option value="redo">Redo only</option><option value="all">All</option></select></label>
<label>Volume <input id="vol" type="range" min="0" max="1" step=".05" value=".6"></label>
<label><input id="loop" type="checkbox" checked> loop music</label>
<button id="stop">Stop</button><button id="copy">Copy redo list</button><button id="save">Save to dev server</button>
<span class="count" id="count"></span></div><div id="status">Pick a sound.</div></header>
